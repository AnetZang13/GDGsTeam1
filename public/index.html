<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <link rel="stylesheet" href="main.css">
  <link href="https://fonts.googleapis.com/css?family=Jacques+Francois&display=swap" rel="stylesheet" />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
  <script src="script.js"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
</head>

<body>
  <div id="app-container">
    <div id="header">
      <h1 id="app-title">My Calendar</h1>
      <div id="menu-container">
        <button id="menu-button">Menu</button>
      </div>
    </div>

    <div id="menu-list" class="hidden">
      <ul>
        <li><a href="login.html">Login page</a></li>
        <li><a href="index.html">Calendar</a></li>
        <li><a href="map.html">Campus Map</a></li>
      </ul>
    </div>

    <div id="main-content">
      <div id="calendar"></div>
      <div id="todo-list">
        <h2>Todo List</h2>
        <ul id="todos"></ul>
        <input type="text" id="new-todo" placeholder="Add a new todo!">
        <button id="add-todo">Add</button>
        <h2>Completed items</h2>
        <button id="show">Show</button>
        <ul id="completed-todos" style="display: none;"></ul>
        <h2>Add event</h2>
        <button id="open-modal">Add Event</button>
      </div>
    </div>

    <!-- Event Modal -->
    <div id="eventModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div class="form-group">
          <label for="event-title">Event name:</label>
          <input type="text" id="event-title" placeholder="Event Title" required>
        </div>
        <div class="form-group">
          <label for="event-start">Start time:</label>
          <input type="datetime-local" id="event-start" required>
        </div>
        <div class="form-group">
          <label for="event-end">End time:</label>
          <input type="datetime-local" id="event-end">
        </div>
        <div class="form-group">
          <label for="event-notes">Notes:</label>
          <div id="quill-editor"></div>
        </div>
        <button id="add-event-button">Add Event</button>
      </div>
    </div>
    <div id="eventPopup" class="modal">
      <div class="modal-content">
        <span class="close-popup">&times;</span>
        <h3 id="popup-title"></h3>
        <p><strong>Start:</strong> <span id="popup-start"></span></p>
        <p><strong>End:</strong> <span id="popup-end"></span></p>
        <p><strong>Notes:</strong></p>
        <div id="popup-notes"></div>
      </div>
    </div>
    

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const userID = localStorage.getItem('userID');
    
      if (!userID) {
          alert("You are not logged in!");
          window.location.href = "login.html";
          return;
      }

      loadTodos(userID);

      document.getElementById('add-todo').addEventListener('click', () => {
          const toDo = document.getElementById('new-todo').value.trim();

          if (!toDo) {
              alert("Please enter a todo item!");
              return;
          }

          fetch('http://localhost:3307/add-todo', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userID, toDo })
          })
          .then(response => response.json())
          .then(data => {
              alert(data.message);  
              if (data.success) {
                  document.getElementById('new-todo').value = '';
                  loadTodos(userID);
              }
          })
          .catch(error => {
              console.error('Error:', error);
              alert("Failed to add todo.");
          });
      });

      // Event modal open/close functionality
      const modal = document.getElementById("eventModal");
      const openBtn = document.getElementById("open-modal");
      const closeBtn = document.querySelector(".close");

      openBtn.onclick = () => {
        modal.style.display = "block"; // Show the modal when the button is clicked
      };

      closeBtn.onclick = () => {
        modal.style.display = "none"; // Hide the modal when the close button is clicked
      };

      // Close the modal if clicked outside
      window.onclick = (event) => {
        if (event.target === modal) {
          modal.style.display = "none";
        }
      };
    });

    function loadTodos(userID) {
      fetch(`http://localhost:3307/get-todos/${userID}`)
          .then(response => response.json())
          .then(data => {
              const todoList = document.getElementById('todos');
              todoList.innerHTML = '';

              data.forEach(todo => {
                  const li = document.createElement('li');
                  li.textContent = todo.toDo;

                  const completeButton = document.createElement('button');
                  completeButton.textContent = 'Completed!';
                  completeButton.style.backgroundColor = 'green';
                  completeButton.onclick = () => completeTodo(todo.id, li);

                  li.appendChild(completeButton);
                  todoList.appendChild(li);
              });
          })
          .catch(error => console.error('Error loading todos:', error));
    }

    function completeTodo(id, li) {
      fetch('http://localhost:3307/complete-todo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
      })
      .then(response => response.json())
      .then(data => {
          if (data.success) {
              li.remove();
              const completedList = document.getElementById('completed-todos');
              const completedItem = document.createElement('li');
              completedItem.textContent = li.textContent.replace('Completed!', '').trim();
              completedList.appendChild(completedItem);
          }
      })
      .catch(error => console.error('Error completing todo:', error));
    }
  </script>
</body>

</html>
